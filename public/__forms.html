<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head>
<body>
<!-- Netlify Forms detects these at deploy time. The live pages post to this file with fetch. Do not rename the forms: the weekly newsletter task reads them by name. -->
<form name="ai-money-map-subscribe" data-netlify="true" netlify-honeypot="company" hidden>
  <input type="email" name="email">
  <input type="text" name="consent">
  <input type="text" name="source">
  <input type="text" name="company">
</form>
<form name="ai-money-map-unsubscribe" data-netlify="true" netlify-honeypot="company" hidden>
  <input type="email" name="email">
  <input type="text" name="company">
</form>
</body></html>
